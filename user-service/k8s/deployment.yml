apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      serviceAccountName: user-service-account
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: user-service
          image: rayaneparis/user-service:3
          ports:
            - containerPort: 8082